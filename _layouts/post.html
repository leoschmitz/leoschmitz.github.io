---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>

  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.categories.size > 0 %}
        <span class="card-category">{{ page.categories | first | capitalize }}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
