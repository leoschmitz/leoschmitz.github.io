<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#0d9488">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
        <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 4.5 5 11 5 11h4s5-6.5 5-11c0-3.87-3.13-7-7-7z" fill="#0d9488"/>
          <circle cx="12" cy="9" r="2.6" fill="#ffffff"/>
        </svg>
        <span class="site-title">{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}class="active"{% endif %}>About Me</a>
      </nav>
    </div>
  </header>

  <main class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <span>Built with <a href="https://jekyllrb.com">Jekyll</a>{% if site.github_username %} &middot; <a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}</span>
    </div>
  </footer>
</body>
</html>
